{
  "schema_version": "1.0",
  "coverage": "all-maintained-files",
  "detail": "importance-based",
  "rules": [
    {"id": "system", "kinds": ["system"], "topics": ["needs", "design-inputs", "architecture", "system-constraints"], "layout": "combined-or-split"},
    {"id": "module", "kinds": ["module"], "topics": ["needs", "design-inputs", "responsibility", "contracts", "source-map", "verification"], "layout": "combined-or-split"},
    {"id": "stateful", "kinds": ["stateful-component"], "topics": ["states", "transitions", "invariants", "failure-recovery"], "layout": "combined-or-split"},
    {"id": "service", "kinds": ["runnable-service"], "topics": ["configuration", "observability", "operations", "rollback"], "layout": "combined-or-split"}
  ],
  "excludes": [
    {"path": ".agents/skills/accord", "reason": "Installed Accord runtime is covered by its installation provenance."},
    {"path": ".accord", "reason": "Accord control metadata is validated separately; project source must not be hidden here."}
  ]
}
