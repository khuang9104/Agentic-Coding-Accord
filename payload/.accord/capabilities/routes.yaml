{
  "schema_version": "1.3",
  "route_config": "accord-capability-routes",
  "mode": "approved-integrated-adapters",
  "routes": [
    {
      "id": "initial-knowledge",
      "purpose": "Build or rebuild the complete project documentation view from repository evidence.",
      "triggers": [
        "organize project documentation",
        "organize project knowledge",
        "organize project documentation and knowledge",
        "document this codebase",
        "map this codebase",
        "onboard me to this repository",
        "整理项目文档",
        "整理项目知识库",
        "整理项目文档和知识库",
        "生成项目文档",
        "建立项目知识库",
        "了解整个项目"
      ],
      "methods": [
        "acquire-codebase-knowledge",
        "arch"
      ],
      "output_root": "docs",
      "durable_outputs": [
        "docs/README.md",
        "docs/manifest.yaml",
        "docs/agent-context.md",
        "docs/system-overview.md",
        "docs/architecture.md",
        "docs/interfaces-and-data.md",
        "docs/glossary.md",
        "docs/modules/"
      ],
      "temporary_outputs": [],
      "approval": "pre-approved-integrated"
    },
    {
      "id": "change-context",
      "purpose": "Map the files, dependencies, tests, and reference patterns for the active Change.",
      "triggers": [
        "before implementing",
        "plan this change",
        "prepare the change context",
        "分析这次变更",
        "实现这个需求",
        "修改这个模块"
      ],
      "methods": [
        "context-engineering"
      ],
      "output_root": ".accord/changes/",
      "durable_outputs": [],
      "temporary_outputs": [
        ".accord/changes/<change-id>.md"
      ],
      "approval": "pre-approved-integrated"
    },
    {
      "id": "knowledge-refresh",
      "purpose": "Refresh only affected project documentation before Change acceptance or when the user requests a refresh.",
      "triggers": [
        "refresh project documentation",
        "update project documentation",
        "update project knowledge",
        "刷新项目文档",
        "更新项目知识库",
        "根据变更更新文档"
      ],
      "methods": [
        "context-engineering",
        "arch"
      ],
      "output_root": "docs",
      "durable_outputs": [
        "docs/README.md",
        "docs/manifest.yaml",
        "docs/agent-context.md",
        "docs/system-overview.md",
        "docs/architecture.md",
        "docs/interfaces-and-data.md",
        "docs/glossary.md",
        "docs/modules/"
      ],
      "temporary_outputs": [],
      "approval": "pre-approved-integrated"
    },
    {
      "id": "knowledge-query",
      "purpose": "Answer a project question from the smallest current documentation view.",
      "triggers": [
        "how does this project work",
        "where is this implemented",
        "what module owns",
        "项目是怎么工作的",
        "这个功能在哪个模块",
        "查询项目架构"
      ],
      "methods": [],
      "output_root": null,
      "durable_outputs": [],
      "temporary_outputs": [],
      "approval": "pre-approved-integrated"
    },
    {
      "id": "documentation-writing",
      "purpose": "Write or improve the requested documentation in its existing location; discover additional project facts only when needed.",
      "triggers": ["improve the readme", "write a how-to guide", "rewrite this documentation", "documentation-writer", "优化readme", "优化一下readme", "编写使用指南", "改善文档可读性"],
      "methods": ["documentation-writer"],
      "output_root": null,
      "durable_outputs": [],
      "temporary_outputs": [],
      "approval": "pre-approved-integrated"
    },
    {
      "id": "bug-reproduction",
      "purpose": "Establish minimal defect evidence, then stop, diagnose or continue authorized repair according to the user's task.",
      "triggers": ["reproduce this bug", "fix this bug", "bug-reproduction-brief", "复现这个问题", "修复这个bug", "修复这个 bug", "排查这个故障"],
      "methods": ["bug-reproduction-brief"],
      "output_root": null,
      "durable_outputs": [],
      "temporary_outputs": [],
      "approval": "pre-approved-integrated"
    },
    {
      "id": "refactor-planning",
      "purpose": "Sequence a multi-file refactor using the current Context Map and existing Change or response; continue already approved implementation.",
      "triggers": ["plan this refactor", "refactor these modules", "refactor-plan", "规划这次重构", "重构这几个模块", "多模块重构"],
      "methods": ["context-engineering", "refactor-plan"],
      "output_root": null,
      "durable_outputs": [],
      "temporary_outputs": [],
      "approval": "pre-approved-integrated"
    },
    {
      "id": "test-verification",
      "purpose": "Map approved inputs and intended-use scenarios to the existing project test stack and revision-bound V&V evidence.",
      "triggers": ["run the tests", "verify this change", "test this project", "运行测试", "测试这个项目", "验证这次变更", "V&V"],
      "methods": [],
      "output_root": null,
      "durable_outputs": [],
      "temporary_outputs": [],
      "approval": "pre-approved-integrated"
    },
    {
      "id": "web-testing",
      "purpose": "Test approved browser-visible scenarios using available project tools; loading the method grants no installation or target access.",
      "triggers": ["test this web app", "browser regression", "webapp-testing", "测试网页", "浏览器回归", "测试用户流程"],
      "methods": ["webapp-testing"],
      "output_root": null,
      "durable_outputs": [],
      "temporary_outputs": [],
      "approval": "pre-approved-integrated"
    }
  ]
}
